<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen Muestra Química - EXANI II</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .title-font { font-family: 'Playfair Display', serif; }
        .question-card { transition: all 0.3s ease; }
        .progress-bar { transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen">
    <div class="max-w-4xl mx-auto">
        <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
            <div class="px-6 py-5 flex items-center justify-between">
                <div class="flex items-center gap-x-3">
                    <div class="w-11 h-11 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-3xl font-bold title-font">Q</div>
                    <div>
                        <h1 class="text-2xl font-bold text-slate-800 title-font tracking-tight">Examen Química</h1>
                        <p class="text-xs text-slate-500">Simulador EXANI II</p>
                    </div>
                </div>
                <div id="progress-header" class="hidden flex items-center gap-x-4 text-sm">
                    <span id="current-exercise-header" class="font-semibold text-blue-700"></span>
                    <div class="h-2 w-32 bg-slate-200 rounded-full overflow-hidden">
                        <div id="progress-bar-header" class="progress-bar h-2 bg-blue-600 w-0"></div>
                    </div>
                </div>
            </div>
        </header>

        <div id="start-screen" class="min-h-[calc(100vh-80px)] flex items-center justify-center px-6">
            <div class="max-w-xl text-center">
                <h2 class="text-5xl title-font font-bold text-slate-800 mb-6">Simulador de Química</h2>
                <p class="text-lg text-slate-600 mb-10">51 preguntas con retroalimentación inmediata y registro en Google Sheets.</p>
                <button onclick="startQuiz()" class="px-10 py-5 bg-blue-600 text-white rounded-3xl font-semibold text-lg shadow-lg hover:bg-blue-700 transition-all">
                    INICIAR EXAMEN
                </button>
            </div>
        </div>

        <div id="quiz-screen" class="hidden px-6 py-8 pb-32">
            <div class="mb-8 flex justify-between items-end">
                <div>
                    <span id="exercise-number" class="text-blue-600 font-mono text-4xl font-bold">01</span>
                    <span id="exercise-title" class="ml-4 text-2xl font-semibold text-slate-800 uppercase tracking-wide"></span>
                </div>
            </div>
            <div id="questions-container" class="space-y-8"></div>
            
            <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-5 z-50">
                <div class="max-w-4xl mx-auto flex justify-between">
                    <button id="btn-prev" onclick="prevExercise()" class="px-8 py-4 border rounded-3xl disabled:opacity-30">Anterior</button>
                    <button id="btn-next" onclick="nextExercise()" class="px-8 py-4 bg-slate-800 text-white rounded-3xl">Siguiente</button>
                </div>
            </div>
        </div>

        <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center hidden z-[100]">
            <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-md w-full mx-4 text-center">
                <h2 class="text-2xl font-bold mb-4">¡Terminaste!</h2>
                <p class="mb-6 text-slate-600">Ingresa tus datos para enviar tu puntuación a la base de datos.</p>
                <input id="userName" type="text" placeholder="Tu nombre" class="w-full p-4 border rounded-2xl mb-4">
                <input id="userEmail" type="email" placeholder="Tu correo" class="w-full p-4 border rounded-2xl mb-6">
                <button onclick="submitData()" class="w-full py-4 bg-blue-600 text-white rounded-2xl font-bold">ENVIAR Y VER RESULTADOS</button>
            </div>
        </div>

        <div id="results-screen" class="hidden px-6 py-12">
            <div class="max-w-3xl mx-auto text-center">
                <div class="bg-white p-10 rounded-3xl shadow-sm border mb-8">
                    <h2 class="text-3xl font-bold mb-2">Tu Resultado</h2>
                    <div class="text-7xl font-bold text-emerald-600" id="final-score">0</div>
                    <p class="text-slate-400">de 51 aciertos</p>
                    <div id="score-label" class="mt-4 font-bold text-xl"></div>
                </div>
                <div id="feedback-container" class="text-left space-y-6"></div>
                <button onclick="location.reload()" class="mt-10 px-8 py-4 bg-slate-800 text-white rounded-2xl">Reiniciar Simulador</button>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz3kYPwrMZzeD_gIrNI1LS2ZgNVX1dCoU5thZC50fDL9bx8Xyhy_sk_CGwKbJs0Vi8qRw/exec'; // <--- PEGA TU URL DE APPS SCRIPT AQUÍ

        const titles = [
            "Química Básica I", "Estructura Atómica", "Tabla Periódica", "Reacciones Ácidas", 
            "Estequiometría", "Propiedades y Solubilidad", "Óxidos Básicos", "Óxidos Ácidos", 
            "Lluvia Ácida", "Termoquímica", "Comportamiento de Gases"
        ];

        // Preguntas extraídas del PDF [cite: 6-9]
        const questionsData = [
            [
                { question: "¿Cuál de las siguientes sustancias es un compuesto?", options: ["A) O3", "B) Cl2", "C) CO", "D) Br2"], correct: 2, explanation: "Correcta: C) CO es un compuesto formado por carbono y oxígeno." },
                { question: "¿Cuántos protones, electrones y neutrones tiene el átomo con número atómico 25 y masa 55?", options: ["A) 25p, 25e y 30n", "B) 25p, 25e y 55n", "C) 25p, 30e y 25n", "D) 30p, 25e y 25n"], correct: 0, explanation: "p=25, e=25, n=55-25=30." },
                { question: "En la tabla periódica, los elementos en una misma columna:", options: ["A) Masa igual", "B) Comportamiento químico similar", "C) Mismo periodo", "D) Son gases"], correct: 1, explanation: "Los grupos (columnas) comparten propiedades similares." }
            ],
            [
                { question: "¿Qué compuestos reaccionan con agua para formar un ácido?", options: ["A) I y IV", "B) I y III", "C) IV y V", "D) III y V"], correct: 3, explanation: "Los anhídridos como ClO2 y SO2 forman ácidos al hidratarse." },
                { question: "La fórmula KClO3 indica que un mol contiene:", options: ["A) 1 mol K, 1 mol Cl, 3 mol O", "B) 1 mol Na", "C) 2 mol K", "D) 6 mol K"], correct: 0, explanation: "Estequiometría directa de la fórmula." },
                { question: "¿Qué sustancia cambia tornasol a azul y fenolftaleína a rosa?", options: ["A) Sal ácida", "B) Base o hidróxido", "C) Ácido fuerte", "D) Óxido básico"], correct: 1, explanation: "Propiedades básicas clásicas." }
            ],
            [
                { question: "La solubilidad de un soluto aumenta:", options: ["A) Al subir temperatura", "B) Al subir soluto", "C) Al bajar solvente", "D) Constante"], correct: 0, explanation: "La energía térmica facilita la disolución." },
                { question: "¿Cuál es un óxido básico?", options: ["A) CaO", "B) CO2", "C) SO3", "D) N2O5"], correct: 0, explanation: "Metal (Ca) + Oxígeno." },
                { question: "¿Cuál es un óxido ácido?", options: ["A) Na2O", "B) K2O", "C) SO3", "D) CaO"], correct: 2, explanation: "No metal (S) + Oxígeno." }
            ],
            [
                { question: "Reacción de lluvia ácida (H2SO4) con mármol (CaCO3):", options: ["A) Solo CaSO4", "B) Con HCl", "C) Con HNO3", "D) CaSO4 + H2O + CO2"], correct: 3, explanation: "Neutralización con liberación de gas." },
                { question: "Reacción que requiere energía UV del sol:", options: ["A) Exotérmica", "B) Endotérmica", "C) Combustión", "D) Neutralización"], correct: 1, explanation: "Absorbe energía (Endo)." },
                { question: "Oxidación intensa que genera fuego:", options: ["A) Reacción química", "B) Potencial", "C) Exotérmico", "D) Endotérmico"], correct: 2, explanation: "Libera energía (Exo)." }
            ],
            [
                { question: "Al calentar un gas, ¿qué sucede?", options: ["A) Bajan ambos", "B) Suben energía y volumen", "C) Baja energía", "D) Baja volumen"], correct: 1, explanation: "Leyes de los gases: mayor calor, mayor expansión y energía." }
            ]
        ];

        let currentExercise = 0;
        let userAnswers = Array(questionsData.length).fill().map((_, i) => Array(questionsData[i].length).fill(null));

        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('progress-header').classList.remove('hidden');
            renderExercise();
        }

        function renderExercise() {
            document.getElementById('exercise-number').textContent = String(currentExercise + 1).padStart(2, '0');
            document.getElementById('exercise-title').textContent = titles[currentExercise] || "Química";
            
            const total = questionsData.length;
            const progress = ((currentExercise + 1) / total) * 100;
            document.getElementById('progress-bar-header').style.width = `${progress}%`;
            document.getElementById('current-exercise-header').textContent = `Ejercicio ${currentExercise + 1}/${total}`;

            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            questionsData[currentExercise].forEach((q, qIndex) => {
                const div = document.createElement('div');
                div.className = 'question-card bg-white border rounded-3xl p-6 shadow-sm';
                div.innerHTML = `
                    <p class="font-bold text-slate-800 mb-4">${qIndex + 1}. ${q.question}</p>
                    <div class="space-y-2">
                        ${q.options.map((opt, optIdx) => `
                            <label onclick="selectOption(${qIndex}, ${optIdx})" class="flex items-center gap-3 p-4 border rounded-2xl cursor-pointer ${userAnswers[currentExercise][qIndex] === optIdx ? 'bg-blue-50 border-blue-500' : ''}">
                                <div class="w-5 h-5 border-2 rounded-full ${userAnswers[currentExercise][qIndex] === optIdx ? 'bg-blue-500' : ''}"></div>
                                <span>${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
                container.appendChild(div);
            });

            document.getElementById('btn-prev').disabled = currentExercise === 0;
            document.getElementById('btn-next').textContent = currentExercise === total - 1 ? "Finalizar" : "Siguiente";
        }

        function selectOption(qIdx, optIdx) {
            userAnswers[currentExercise][qIdx] = optIdx;
            renderExercise();
        }

        function nextExercise() {
            if (currentExercise < questionsData.length - 1) {
                currentExercise++;
                renderExercise();
                window.scrollTo(0,0);
            } else {
                document.getElementById('modal').classList.remove('hidden');
            }
        }

        function prevExercise() {
            if (currentExercise > 0) {
                currentExercise--;
                renderExercise();
            }
        }

        function submitData() {
            const name = document.getElementById('userName').value;
            const email = document.getElementById('userEmail').value;
            if (!name || !email) return alert("Completa los datos");

            let score = 0;
            userAnswers.flat().forEach((ans, i) => {
                if(ans === questionsData.flat()[i]?.correct) score++;
            });

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ name, email, score })
            });

            document.getElementById('modal').classList.add('hidden');
            showResults(score);
        }

        function showResults(score) {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.remove('hidden');
            document.getElementById('final-score').textContent = score;
            
            const container = document.getElementById('feedback-container');
            questionsData.flat().forEach((q, i) => {
                const ans = userAnswers.flat()[i];
                const correct = ans === q.correct;
                const card = document.createElement('div');
                card.className = `p-5 rounded-2xl border-l-4 bg-white ${correct ? 'border-emerald-500' : 'border-red-500'}`;
                card.innerHTML = `
                    <p class="font-bold">${q.question}</p>
                    <p class="text-sm mt-1">Respuesta: ${ans !== null ? q.options[ans] : 'Vacía'}</p>
                    <p class="text-xs text-slate-500 mt-2 italic">${q.explanation}</p>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
